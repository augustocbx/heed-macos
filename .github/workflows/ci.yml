name: Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Server tests
        run: bun test packages/server/lib
      - name: Validated service configuration and safe process rollback tests
        run: python3 -m unittest discover -s scripts -p 'service_*_test.py'
      - name: Scoped Meet bridge tests
        run: bun test packages/desktop/browser-meet
      - name: Mounted SMB filesystem safety tests
        run: python3 packages/server/native/smb-filesystem.test.py
      - name: Interface tests
        run: NODE_OPTIONS=--no-experimental-webstorage bun run --cwd packages/client test --run
      - name: Speaker identity preservation tests
        run: python3 -m unittest discover -s packages/transcription -p voice_identity_test.py
      - name: Meeting language and transcription policy tests
        run: python3 -m unittest discover -s packages/transcription -p meeting_language_test.py
      - name: Manual transcription selection tests
        run: python3 -m unittest discover -s packages/transcription -p manual_transcription_test.py
      - name: Native transcription deadline and owned process cleanup tests
        run: python3 -m unittest discover -s packages/transcription -p '*worker_test.py'
      - name: Managed audio working directory tests
        run: python3 -m unittest discover -s packages/transcription -p managed_work_test.py
      - name: Check Python syntax
        run: python3 -m py_compile packages/transcription/transcription_server.py packages/transcription/voice_identity.py packages/transcription/meeting_language.py packages/transcription/manual_transcription.py packages/desktop/browser-meet/native-host.py packages/desktop/browser-meet/register-host.py packages/transcription/managed_work.py packages/transcription/native_worker.py packages/transcription/process_ownership.py packages/transcription/worker_lifecycle.py packages/transcription/doctor.py packages/transcription/engines.py
      - name: Build interface
        run: bun run build
      - name: Check installers
        run: bash -n install-macos.sh packages/desktop/install-menubar.sh packages/desktop/macos/start-services.sh packages/desktop/native-keychain/build.sh packages/desktop/icloud-folder/build.sh scripts/release/build-release.sh scripts/release/install.sh scripts/release/uninstall.sh scripts/release/simulate.sh scripts/release/menu-update-qa.sh
      - name: Release installer helper tests
        run: /usr/bin/python3 -m unittest discover -s scripts/release -p '*_test.py'
      - name: Validate native capture without physical devices
        run: |
          swiftc -O -target "$(uname -m)-apple-macos14.0" packages/transcription/native/heed-parakeet/Sources/heed-syscap/*.swift -o "$RUNNER_TEMP/heed-syscap-check"
          "$RUNNER_TEMP/heed-syscap-check" --self-test
      - name: Validate native protected credential helper without Keychain access
        run: HEED_KEYCHAIN_BUILD_DIR="$RUNNER_TEMP/heed-keychain-check" bash packages/desktop/native-keychain/build.sh --build-only
      - name: Validate scoped iCloud folder without a private account
        run: |
          HEED_ICLOUD_OUTPUT="$RUNNER_TEMP/heed-icloud-check" bash packages/desktop/icloud-folder/build.sh
          "$RUNNER_TEMP/heed-icloud-check" --self-test
      - name: Build menu app
        run: bash packages/desktop/install-menubar.sh --build-only
